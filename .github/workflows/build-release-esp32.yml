# ESP32-DIV 云端编译 + 自动发版
# 触发方式：
#   1. push 到 main：只验证编译，不发布
#   2. 打 tag 发版：git tag v1.0.0 && git push origin v1.0.0
#      → 自动编译并把 bin/elf/SHA256SUMS 挂到 GitHub Releases
# 构建约束（与本地环境一致，勿随意改）：
#   esp32 core 2.0.10 / ESP32-S3 / FlashSize=8M / PartitionScheme=huge_app
name: ESP32 Build and Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: 安装 ESP32 核心 2.0.10
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.10

      - name: 安装外部依赖库
        run: |
          rm -f libfail.txt
          for lib in "Adafruit PN532" "Adafruit BusIO@1.9.3" "ArduinoJson@6.21.2" "IRremoteESP8266" "NimBLE-Arduino@1.4.3" "RF24" "XPT2046_Touchscreen"; do
            if ! arduino-cli lib install "$lib" > /tmp/libout.txt 2>&1; then
              echo "LIB_FAILED: $lib" | tee -a libfail.txt
              cat /tmp/libout.txt >> libfail.txt
            fi
          done
          if [ -f libfail.txt ]; then echo "有库安装失败"; exit 1; fi
        # 依赖清单来自对工程全部 #include 的静态扫描
        # TFT_eSPI、SmartRC-CC1101、RCSwitch(仓库内 Libraries/RCSwitch, 本地 v2.6.4)使用仓库内 Libraries 目录的版本（含定制 User_Setup），不从索引安装
        # NimBLE 钉 1.4.x：2.x 需要 IDF5，与 esp32 core 2.0.10 不兼容
        # ArduinoJson 钉 6.x：v7 API 不兼容

      - name: 编译固件
        run: |
          set -o pipefail
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:FlashSize=8M,PartitionScheme=huge_app" \
            --libraries "ESP32-DIV交接/ESP32-DIV-main/Libraries" \
            --build-property "compiler.c.elf.extra_flags=-Wl,--allow-multiple-definition" \
            --build-path ".ci_build" \
            "ESP32-DIV交接/ESP32-DIV-main/ESP32-DIV" 2>&1 | tee compile_output.txt
          # 板型必须与本地 build_p0.sh 一致：esp32s3（不是 esp32），否则 DRAM 布局不符会溢出

      - name: 失败时把日志开成 Issue（供无凭证排障）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'CI 失败 @ ' + context.sha.slice(0,7) + '\n\n';
            for (const f of ['libfail.txt', 'compile_output.txt', 'ci_ls.txt']) {
              try {
                const t = fs.readFileSync(f, 'utf8');
                const lines = t.replace(/\u001b\[[0-9;]*m/g, '').split('\n');
                const errs = lines.filter(l => /error|fatal|No such file|undefined reference|multiple definition|overflow|first defined here|region/i.test(l)).slice(-80);
                body += '=== ' + f + ' error lines ===\n```\n' + (errs.join('\n') || '(无匹配行)') + '\n```\n\n';
                body += '=== ' + f + ' tail ===\n```\n' + t.slice(-1500) + '\n```\n\n';
              } catch (e) { body += '=== ' + f + ' === 不存在\n\n'; }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI 失败 ' + context.sha.slice(0,7),
              body: body
            });

      - name: 整理产物
        run: |
          mkdir -p release
          ls -la .ci_build | tee ci_ls.txt
          find .ci_build -maxdepth 1 -type f \( -name "*.bin" -o -name "*.elf" \) -print -exec cp {} release/ \; | tee -a ci_ls.txt
          if [ -z "$(find .ci_build -maxdepth 1 -name '*.bin')" ]; then
            echo "NO_BIN_FOUND" | tee -a ci_ls.txt
            exit 1
          fi
          sha256sum release/* > release/SHA256SUMS.txt
          ls -la release/

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-DIV-firmware
          path: release/

      - name: 创建 Release 并挂载产物（仅打 tag 时生效）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
